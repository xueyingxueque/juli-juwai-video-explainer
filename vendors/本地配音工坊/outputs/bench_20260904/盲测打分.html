<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TTS 人耳盲测打分</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --txt:#1f2328; --dim:#6b7280;
    --accent:#2563eb; --accent-d:#1d4ed8; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:28px 20px 60px;background:var(--bg);color:var(--txt);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;}
  .wrap{max-width:1080px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
  button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px;
         font-size:13px;cursor:pointer}
  button:hover{background:var(--accent-d)}
  button.ghost{background:#fff;color:var(--txt);border:1px solid var(--line)}
  button.ghost:hover{background:#f0f2f5}
  .ref{background:#fffbea;border:1px solid #fde68a;border-radius:8px;padding:12px 14px;margin-bottom:18px}
  .ref b{color:#92400e}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:14px 16px;margin-bottom:12px}
  .card.done{border-color:#86efac;box-shadow:0 0 0 2px #dcfce7 inset}
  .head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .lab{font-size:22px;font-weight:700;width:34px;height:34px;line-height:34px;text-align:center;
       border-radius:8px;background:#eef2ff;color:var(--accent);flex:none}
  .name{font-weight:600}
  .revealed{color:var(--dim);font-size:12px;margin-left:auto}
  audio{width:100%;margin:10px 0 2px}
  .dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:10px}
  .dim{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .dim .t{font-size:12px;color:var(--dim);margin-bottom:4px}
  .stars{display:flex;gap:4px}
  .stars button{background:#f3f4f6;color:#374151;border:1px solid var(--line);
                width:30px;height:28px;padding:0;border-radius:5px;font-size:13px}
  .stars button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .foot{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap}
  .foot label{font-size:13px;display:flex;align-items:center;gap:5px;cursor:pointer}
  input[type=text]{flex:1;min-width:180px;border:1px solid var(--line);border-radius:6px;
                   padding:6px 9px;font-size:13px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);
        border-radius:8px;overflow:hidden;margin-top:10px;font-size:13px}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  th{background:#f9fafb;font-weight:600}
  td.l{text-align:left}
  .hide{display:none}
  .tip{font-size:12px;color:var(--dim);margin-top:6px}
  .score{font-weight:700}
  .s-good{color:var(--ok)} .s-mid{color:var(--warn)} .s-bad{color:var(--bad)}
</style>
</head>
<body><div class="wrap">
<h1>TTS 人耳盲测打分</h1>
<div class="sub">随机编号 · 隐藏引擎名 · 听完打分 → 导出 JSON 回填技能文档。同文案 133 字，建议戴耳机。</div>

<div class="ref">
  <b>参考音（非盲，用于判断「像不像」）：</b> 小欧_24k.wav
  <audio controls src="refs/小欧_24k.wav"></audio>
</div>

<div class="bar">
  <button onclick="shuffle()">重新洗牌</button>
  <button class="ghost" onclick="reveal()">揭晓引擎名与机器分</button>
  <button onclick="exportJson()">导出结果 JSON</button>
  <button class="ghost" onclick="clearAll()">清空评分</button>
  <span class="tip" id="prog"></span>
</div>

<div id="list"></div>

<div id="revealBox" class="hide">
  <h2 style="font-size:16px;margin:22px 0 6px">机器客观分对照（客观指标，非主观音质）</h2>
  <div class="tip" style="margin-bottom:6px">
    CER = ASR 回听字错率（越低越咬字清楚）· sim = ECAPA 音色相似度余弦（越接近 1 越像参考音）·
    bw = 频谱 -60dB 截止频率 · f0σ = 基频起伏（半音标准差，越小越念稿）
  </div>
  <table id="tbl"></table>
</div>

<script>
const DATA = [{"file": "pilottts_30s.wav", "sr": 24000, "duration": 30.16, "peak_dbfs": -0.73, "rms_dbfs": -18.42, "clip_ratio": 0.0, "speech_ratio": 89.9, "max_pause_s": 0.41, "head_sil_s": 0.0, "f_cut_60db": 11977, "f_energy_999": 6961, "f0_mean": 271.8, "f0_std": 59.3, "f0_std_semitone": 3.73, "voiced_ratio": 0.697, "cer": 0.0602, "gt_used": "main", "asr": "早上好,这里是今天的人工智能快报深度求索发布新一代大模型,推理成本下降三成意味达最新财报显示,数据中心业务增长了94%这些数字和我们有什么关系?关系很大,当调用成本降到十分之一过去跑不通的场景,今年会集中爆发一个五人小团队也能负担全天在线的", "kw_miss": ["英伟达"], "sim": 0.9284, "parts": {"clarity": 59.9, "similarity": 100.0, "bandwidth": 85.1, "clean": 100.0, "prosody": 93.2}, "score": 83.0, "engine": "PilotTTS"}, {"file": "dotstts_30s.wav", "sr": 48000, "duration": 31.36, "peak_dbfs": -5.38, "rms_dbfs": -24.99, "clip_ratio": 0.0, "speech_ratio": 80.4, "max_pause_s": 0.7, "head_sil_s": 0.02, "f_cut_60db": 11850, "f_energy_999": 8153, "f0_mean": 252.8, "f0_std": 50.3, "f0_std_semitone": 3.62, "voiced_ratio": 0.572, "cer": 0.0602, "gt_used": "main", "asr": "早上好,这里是今天的人工智能快报深度求索发布新一代大模型推理成本下降三成因为达最新财报显示数据中心业务增长了94%这些数字和我们有什么关系?关系很大当调用成本降到十分之一过去跑不通的场景,今年会集中爆发一个五人小团队也能负担全天在线的客服门", "kw_miss": ["英伟达"], "sim": 0.9084, "parts": {"clarity": 59.9, "similarity": 100.0, "bandwidth": 81.4, "clean": 100.0, "prosody": 90.5}, "score": 82.2, "engine": "dots.tts"}, {"file": "breeze_clone_30s.wav", "sr": 24000, "duration": 30.56, "peak_dbfs": -5.26, "rms_dbfs": -20.99, "clip_ratio": 0.0, "speech_ratio": 99.8, "max_pause_s": 0.0, "head_sil_s": 0.04, "f_cut_60db": 11600, "f_energy_999": 7082, "f0_mean": 272.9, "f0_std": 54.6, "f0_std_semitone": 3.38, "voiced_ratio": 0.65, "cer": 0.058, "gt_used": "alt", "asr": "早上好 这里是今天的AR快报DeepSeek发布新一代大模型推理成本下降三成NVIDIA最新财报显示数据中心业务增长了94%这些数字和我们有什么关系关系很大当调用成本降到十分之一过去跑不通的场景今年会集中爆发一个五人小团队也能负担全天在线的", "kw_miss": ["深度求索", "英伟达"], "sim": 0.8972, "parts": {"clarity": 61.3, "similarity": 99.2, "bandwidth": 74.3, "clean": 100.0, "prosody": 84.5}, "score": 80.9, "engine": "Breeze TTS 2"}, {"file": "indextts2_30s.wav", "sr": 22050, "duration": 28.94, "peak_dbfs": -2.39, "rms_dbfs": -18.63, "clip_ratio": 0.0, "speech_ratio": 97.9, "max_pause_s": 0.26, "head_sil_s": 0.09, "f_cut_60db": 10638, "f_energy_999": 7299, "f0_mean": 272.0, "f0_std": 55.4, "f0_std_semitone": 3.45, "voiced_ratio": 0.694, "cer": 0.0526, "gt_used": "main", "asr": "早上好 这里是今天的人工智能快报深度求索发布新一代大模型推理成本下降三成英伟达最新财报显示数据中心业务增长了94%这些数字和我们有什么关系关系很大当调用成本降到十分之一过去跑不通的场景今年会集中爆发一个五人小团队也能负担全天在线的客服门槛再", "kw_miss": [], "sim": 0.9437, "parts": {"clarity": 64.9, "similarity": 100.0, "bandwidth": 46.8, "clean": 100.0, "prosody": 86.2}, "score": 78.4, "engine": "IndexTTS2"}, {"file": "breeze_e2e_30s.wav", "sr": 24000, "duration": 27.12, "peak_dbfs": -5.23, "rms_dbfs": -21.89, "clip_ratio": 0.0, "speech_ratio": 98.2, "max_pause_s": 0.17, "head_sil_s": 0.0, "f_cut_60db": 11540, "f_energy_999": 7641, "f0_mean": 258.0, "f0_std": 40.9, "f0_std_semitone": 2.66, "voiced_ratio": 0.802, "cer": 0.0902, "gt_used": "main", "asr": "早上好 这里是今年的人工智能快报渗度球所发布新一代大模型 推理成本下降三成英伟达最新财报显示 数据中新业务增长了94%这些数字和我们有什么关系 关系很大当调用成本降到十分之一过去跑不通的场景 今年会集中爆发一个五人小团队也能负担全天在线的客", "kw_miss": ["深度求索", "数据中心"], "sim": 0.8688, "parts": {"clarity": 39.9, "similarity": 91.1, "bandwidth": 72.6, "clean": 100.0, "prosody": 66.5}, "score": 69.3, "engine": "Breeze TTS 2"}, {"file": "chatterbox_30s.wav", "sr": 24000, "duration": 23.68, "peak_dbfs": -0.36, "rms_dbfs": -18.93, "clip_ratio": 0.0, "speech_ratio": 94.8, "max_pause_s": 0.06, "head_sil_s": 0.45, "f_cut_60db": 11488, "f_energy_999": 6981, "f0_mean": 266.7, "f0_std": 63.9, "f0_std_semitone": 4.87, "voiced_ratio": 0.704, "cer": 0.1278, "gt_used": "main", "asr": "早上好 这里是今天的人工智能快报深度求所发布新一代大模型推理成本下降三成 因为达最新财报显示数据中新业务增长了94%这些数字和我们有什么关系 关系很大当调用成本降到1%过去跑不通的场景今年会集中爆发一个五人小团队也能负担全天在线的客服萌还在", "kw_miss": ["深度求索", "英伟达", "数据中心", "十分之一"], "sim": 0.85, "parts": {"clarity": 14.8, "similarity": 85.7, "bandwidth": 71.1, "clean": 100.0, "prosody": 78.2}, "score": 60.1, "engine": "Chatterbox-V3"}, {"file": "breeze_design_30s.wav", "sr": 24000, "duration": 27.68, "peak_dbfs": -6.2, "rms_dbfs": -28.66, "clip_ratio": 0.0, "speech_ratio": 86.1, "max_pause_s": 0.9, "head_sil_s": 0.0, "f_cut_60db": 11517, "f_energy_999": 10997, "f0_mean": 224.5, "f0_std": 46.5, "f0_std_semitone": 3.41, "voiced_ratio": 0.726, "cer": 0.087, "gt_used": "alt", "asr": "早上好 這裡是今天的AI快報Deepseak發布新一代大模型 推理成本下降三成NVIDIA最新財報顯示 數據中心業務增長了94%這些數字和我們有什麼關係 關係很大當調用成本降到1% 過去跑不通的場景今年會集中爆發一個五人小團隊也能負擔全天在", "kw_miss": ["深度求索", "英伟达", "十分之一"], "sim": 0.6044, "parts": {"clarity": 42.0, "similarity": 15.5, "bandwidth": 71.9, "clean": 100.0, "prosody": 85.2}, "score": 52.9, "engine": "Breeze TTS 2"}];
const DIMS = [
  ["natural","整体自然度（1 机械 → 5 真人）"],
  ["sim","像不像参考音色（1 完全不像 → 5 一模一样）"],
  ["clear","咬字清晰度（1 糊 → 5 字字清楚）"],
  ["artifact","杂音/电音/破音（1 很多 → 5 完全没有）"]
];
let order = DATA.map((_,i)=>i);
let ans = {};

function shuffle(){
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  render();
}
function render(){
  const box=document.getElementById("list"); box.innerHTML="";
  order.forEach((idx,pos)=>{
    const d=DATA[idx], lab=String.fromCharCode(65+pos), a=ans[idx]||{};
    const el=document.createElement("div");
    el.className="card"+(DIMS.every(x=>a[x[0]])?" done":"");
    el.innerHTML=`
      <div class="head">
        <div class="lab">${lab}</div>
        <div class="name">${d.file}</div>
        <div class="revealed hide" data-rv="${idx}"></div>
      </div>
      <audio controls preload="none" src="${d.file}" onplay="stopOthers(this)"></audio>
      <div class="tip">时长 ${d.duration}s · ${d.sr}Hz</div>
      <div class="dims">${DIMS.map(([k,t])=>`
        <div class="dim"><div class="t">${t}</div><div class="stars" data-k="${k}" data-i="${idx}">
          ${[1,2,3,4,5].map(v=>`<button class="${a[k]==v?'on':''}" onclick="rate(${idx},'${k}',${v})">${v}</button>`).join("")}
        </div></div>`).join("")}
      </div>
      <div class="foot">
        <label><input type="checkbox" ${a.use?"checked":""} onchange="setUse(${idx},this.checked)"> 愿意实际采用</label>
        <input type="text" placeholder="备注（如：尾音发飘、断句奇怪）" value="${a.note||""}" oninput="setNote(${idx},this.value)">
      </div>`;
    box.appendChild(el);
  });
  updateProg(); document.querySelectorAll("[data-rv]").forEach(x=>{ if(revealed) fillRv(x); });
}
function stopOthers(cur){ document.querySelectorAll("audio").forEach(a=>{ if(a!==cur) a.pause(); }); }
function rate(i,k,v){ ans[i]=ans[i]||{}; ans[i][k]=v; render(); }
function setUse(i,v){ ans[i]=ans[i]||{}; ans[i].use=v; render(); }
function setNote(i,v){ ans[i]=ans[i]||{}; ans[i].note=v; }
function updateProg(){
  const n=Object.values(ans).filter(a=>a&&DIMS.every(d=>a[d[0]])).length;
  document.getElementById("prog").textContent=`已评 ${n}/${DATA.length}`;
}
let revealed=false;
function reveal(){
  revealed=true; document.getElementById("revealBox").classList.remove("hide");
  document.querySelectorAll("[data-rv]").forEach(fillRv);
  const rows=DATA.map((d,i)=>{const a=ans[i]||{};
    const avg=DIMS.filter(x=>a[x[0]]).length? (DIMS.reduce((s,x)=>s+(a[x[0]]||0),0)/DIMS.filter(x=>a[x[0]]).length).toFixed(2):"-";
    const cls=d.score>=80?"s-good":(d.score>=65?"s-mid":"s-bad");
    return `<tr><td class="l">${d.file}</td><td>${d.engine||"-"}</td>
      <td class="score ${cls}">${d.score}</td><td>${d.cer}</td><td>${d.sim}</td>
      <td>${d.f_cut_60db}</td><td>${d.f0_std_semitone}</td>
      <td>${(d.kw_miss||[]).join("、")||"-"}</td><td>${avg}</td></tr>`;}).join("");
  document.getElementById("tbl").innerHTML=
    `<tr><th class="l">文件</th><th>引擎</th><th>机器分</th><th>CER↓</th><th>sim↑</th>
     <th>bw Hz↑</th><th>f0σ</th><th>读错的关键词</th><th>你的均分</th></tr>`+rows;
}
function fillRv(el){
  const d=DATA[+el.dataset.rv];
  el.classList.remove("hide");
  el.textContent=`引擎 ${d.engine||"-"} · 机器分 ${d.score}`;
}
function exportJson(){
  const out=DATA.map((d,i)=>{const a=ans[i]||{};return {
    file:d.file, engine:d.engine, machine_score:d.score, cer:d.cer, sim:d.sim,
    human:{natural:a.natural||null, sim:a.sim||null, clear:a.clear||null, artifact:a.artifact||null},
    adopt:!!a.use, note:a.note||""};});
  const blob=new Blob([JSON.stringify({ref:"小欧_24k.wav",rows:out},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="盲测结果_"+new Date().toISOString().slice(0,10).replace(/-/g,"")+".json";
  a.click();
}
function clearAll(){ if(confirm("清空所有评分？")){ans={};render();} }
shuffle();
</script>
</div></body></html>
